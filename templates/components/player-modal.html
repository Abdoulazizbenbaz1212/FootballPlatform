<div id="playerModal" class="player-modal" aria-hidden="true">

    <div class="player-modal-backdrop" data-close-player></div>

    <div class="player-modal-card">

        <button
            class="player-modal-close"
            type="button"
            data-close-player
            aria-label="Fermer"
        >
            ✕
        </button>

        <div class="player-modal-visual">

            <div class="player-modal-glow"></div>

            <div class="player-modal-avatar" id="modalPlayerAvatar">
                ⚽
            </div>

            <span
                class="player-modal-badge"
                id="modalPlayerBadge"
            >
                WORLD PLAYER
            </span>

        </div>

        <div class="player-modal-info">

            <span class="player-modal-kicker">
                🌍 FOOTBALL PLAYER
            </span>

            <h2 id="modalPlayerName">
                Joueur
            </h2>

            <p id="modalPlayerCountry">
                🌍 —
            </p>

            <div class="player-modal-stats">

                <div>
                    <strong id="modalPlayerPosition">—</strong>
                    <span>Position</span>
                </div>

                <div>
                    <strong id="modalPlayerClub">—</strong>
                    <span>Club</span>
                </div>

                <div>
                    <strong id="modalPlayerBirth">—</strong>
                    <span>Naissance</span>
                </div>

            </div>

            <div
                class="player-modal-description"
                id="modalPlayerDescription"
            >
                Profil du joueur.
            </div>

        </div>

    </div>

</div>
