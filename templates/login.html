<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — Football Platform</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<main class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">⚽</div>

        <h1>Connexion</h1>

        <p>Retrouve la communauté Football Platform.</p>

        <div id="message" class="messages"></div>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="ton@email.com"
                required
            >

            <label>Mot de passe</label>

            <input
                type="password"
                id="password"
                placeholder="Ton mot de passe"
                required
            >

            <button type="submit" id="loginButton">
                Se connecter
            </button>

        </form>

        <p class="auth-link">
            Pas encore de compte ?
            <a href="{{ url_for('register') }}">Créer un compte</a>
        </p>

    </div>

</main>

<script type="module">

import {
    auth,
    signInWithEmailAndPassword
} from "{{ url_for('static', filename='js/firebase.js') }}";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    message.textContent = "";

    button.disabled = true;
    button.textContent = "Connexion...";

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.textContent =
            "✅ Connexion réussie !";

        setTimeout(() => {
            window.location.href = "{{ url_for('profile') }}";
        }, 800);

    } catch (error) {

        if (error.code === "auth/invalid-credential") {

            message.textContent =
                "❌ Email ou mot de passe incorrect.";

        } else if (error.code === "auth/invalid-email") {

            message.textContent =
                "❌ Adresse email invalide.";

        } else if (error.code === "auth/too-many-requests") {

            message.textContent =
                "❌ Trop de tentatives. Réessaie plus tard.";

        } else {

            message.textContent =
                "❌ Impossible de se connecter.";

            console.error(error);
        }

        button.disabled = false;
        button.textContent = "Se connecter";
    }

});

</script>

</body>
</html>
