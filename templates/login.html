<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<main class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">⚽</div>

        <h1>Connexion</h1>

        <p>Content de te revoir.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div>{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="ton@email.com"
                required
            >

            <label>Mot de passe</label>

            <input
                type="password"
                name="password"
                placeholder="Ton mot de passe"
                required
            >

            <button type="submit">
                Se connecter
            </button>

        </form>

        <p class="auth-link">
            Pas encore de compte ?
            <a href="{{ url_for('register') }}">Créer un compte</a>
        </p>

    </div>

</main>

</body>
</html>
