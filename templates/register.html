<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<main class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">⚽</div>

        <h1>Créer ton compte</h1>

        <p>Rejoins la communauté football.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div>{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label>Pseudo</label>

            <input
                type="text"
                name="username"
                placeholder="Ton pseudo"
                minlength="3"
                maxlength="30"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="ton@email.com"
                required
            >

            <label>Mot de passe</label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 8 caractères"
                minlength="8"
                required
            >

            <button type="submit">
                Créer mon compte
            </button>

        </form>

        <p class="auth-link">
            Tu as déjà un compte ?
            <a href="{{ url_for('login') }}">Se connecter</a>
        </p>

    </div>

</main>

</body>
</html>
